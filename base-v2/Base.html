<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prematch — Base v2</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #050505;
    color: var(--fg);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  .device {
    width: 390px;
    height: 844px;
    border-radius: 48px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.65),
      0 0 0 10px #111,
      0 0 0 11px #2a2a2a;
  }
  .screen {
    position: absolute; inset: 0;
    overflow: hidden;
    background: var(--bg);
  }
  .scroll-area {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
  }
  .scroll-area::-webkit-scrollbar { width: 0; height: 0; }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; border-radius: 20px;
    background: #000; z-index: 100;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 54px; z-index: 50; pointer-events: none;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 28px;
    color: #fff;
    font-size: 14px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 5px;
    background: rgba(255,255,255,0.7);
    z-index: 100;
  }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-scroll { scrollbar-width: none; }
  .carousel { scroll-padding-left: 16px; }

  /* Confetti — football celebration on the WON briefing card */
  @keyframes pm-confetti-fall {
    0%   { transform: translate(0, -14px) rotate(var(--rot-start, 0deg)); opacity: 0; }
    12%  { opacity: 0.95; }
    85%  { opacity: 0.85; }
    100% { transform: translate(var(--sway, 0px), 360px) rotate(var(--rot-end, 540deg)); opacity: 0; }
  }
  .pm-confetti-layer {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
    border-radius: 18px;
    z-index: -1;
    animation: pm-confetti-fade 2500ms linear forwards;
  }
  @keyframes pm-confetti-fade {
    0%, 80%  { opacity: 1; }
    100%     { opacity: 0; }
  }
  .pm-confetti-piece {
    position: absolute;
    top: -14px;
    will-change: transform, opacity;
    animation-name: pm-confetti-fall;
    animation-timing-function: cubic-bezier(0.25, 0.55, 0.6, 1);
    animation-fill-mode: forwards;
    animation-iteration-count: 1;
  }

  /* Post-confetti glow — single subtle pulse */
  @keyframes pm-glow-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(200, 241, 53, 0); }
    45%  { box-shadow: 0 0 18px 2px rgba(200, 241, 53, 0.16); }
    100% { box-shadow: 0 0 0 0 rgba(200, 241, 53, 0); }
  }
  .pm-card-pulse {
    animation: pm-glow-pulse 1000ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
</style>
</head>
<body>

<div class="device">
  <div class="island"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span style="display:inline-flex;align-items:center;gap:5px;">
      <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx="0.7" fill="#fff"/><rect x="4.5" y="4" width="3" height="7" rx="0.7" fill="#fff"/><rect x="9" y="2" width="3" height="9" rx="0.7" fill="#fff"/><rect x="13.5" y="0" width="3" height="11" rx="0.7" fill="#fff"/></svg>
      <svg width="14" height="11" viewBox="0 0 14 11"><path d="M7 2.5C8.9 2.5 10.7 3.2 12 4.4l1-1C11.4 1.9 9.3 1 7 1S2.6 1.9 1 3.4l1 1C3.3 3.2 5.1 2.5 7 2.5z" fill="#fff"/><path d="M7 5.5c1.1 0 2.1.4 2.9 1.1l1-1C9.8 4.6 8.5 4 7 4S4.2 4.6 3.1 5.6l1 1C4.9 5.9 5.9 5.5 7 5.5z" fill="#fff"/><circle cx="7" cy="9" r="1.2" fill="#fff"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="#fff" fill="none"/><rect x="2" y="2" width="17" height="7" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <div id="root" class="screen"></div>
  <div class="indicator"></div>
</div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
